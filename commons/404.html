<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<!-- Served by Cloudflare Pages (with HTTP 404) for any path that doesn't exist —
     without this file Pages answers unknown paths with the landing page and a 200,
     so a broken link would look like it worked. Static: no scripts, no requests. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<!-- already dark: browsers' auto-dark modes and Dark Reader must not repaint it (blank-button report, 2026-11-05) -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found — Commons</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p class="sub">This page doesn't exist (yet).</p>
  <h1 dir="rtl" lang="ar">الصفحة غير موجودة</h1>
  <p class="sub" dir="rtl" lang="ar">هذه الصفحة غير موجودة (بعد).</p>
  <a class="btn" href="/">Commons · كومنز</a>
</main>
</body>
</html>
