<style>
*{box-sizing:border-box}
body{margin:0; background:var(--jc-bg); color:var(--jc-ink);
  font:15px/1.6 var(--jc-font); -webkit-font-smoothing:antialiased; min-height:100vh}
main{max-width:860px; margin:0 auto; padding:28px 18px 40px}
header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:6px}
.brandrow{display:flex; align-items:center; gap:11px}
.brandrow svg{flex:0 0 auto}
h1{font-size:26px; font-weight:800; letter-spacing:-.01em; margin:0}
.tagline{color:var(--jc-muted); margin:4px 0 26px; max-width:52ch}
#langBtn{border:1px solid var(--jc-line); background:var(--jc-surface); color:var(--jc-ink);
  border-radius:var(--jc-radius-pill); padding:7px 16px; font-size:13.5px; font-weight:700; cursor:pointer}
.hdr-actions{display:flex; align-items:center; gap:10px}
#authLink{color:var(--jc-ink); font-size:13.5px; font-weight:700; text-decoration:none;
  border-bottom:1px solid var(--jc-line); padding-block:2px; white-space:nowrap}
#bcast{display:none; background:var(--jc-danger); color:#2d0808; border-radius:var(--jc-radius);
  padding:10px 14px; font-weight:700; margin-bottom:16px}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px}
.card{background:var(--jc-surface); border:1px solid var(--jc-line); border-radius:var(--jc-radius);
  padding:18px 16px; display:flex; flex-direction:column; gap:8px}
.card h2{font-size:17px; margin:0}
.card p{margin:0; color:var(--jc-muted); font-size:13.5px; flex:1}
.pill{align-self:flex-start; font-size:11.5px; font-weight:800; letter-spacing:.04em;
  border-radius:var(--jc-radius-pill); padding:4px 10px; background:var(--jc-surface-2);
  color:var(--jc-muted); border:1px solid var(--jc-line); text-transform:uppercase}
a.go{align-self:flex-start; background:var(--jc-accent); color:var(--jc-accent-ink);
  text-decoration:none; font-weight:800; font-size:13.5px; padding:9px 16px; border-radius:10px}
.notice{color:var(--jc-faint); font-size:12px; margin:26px auto 0; line-height:1.7; text-align:center; max-width:62ch}
.notice a{color:var(--jc-muted)}
.errbar{display:none; background:var(--jc-surface-2); border:1px solid var(--jc-line);
  color:var(--jc-warn); border-radius:var(--jc-radius); padding:9px 13px; font-size:13px; margin:0 0 16px}
footer{color:var(--jc-faint); font-size:12px; text-align:center; padding:10px 16px 24px}
footer a{color:var(--jc-muted)}
footer .archive{margin-top:6px}
footer a#archiveLink{white-space:nowrap}
[hidden]{display:none !important}
/* signed-out platform entry (wireframe v4.1 band 01) */
.lede{font-size:17px; color:var(--jc-ink); margin:0 0 6px; max-width:56ch}
.feats{list-style:none; padding:0; margin:14px 0 30px; display:grid; gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.feats li{background:var(--jc-surface); border:1px solid var(--jc-line); border-radius:var(--jc-radius);
  padding:14px; font-size:13.5px; color:var(--jc-muted); display:flex; gap:12px; align-items:flex-start}
.feats b{display:block; color:var(--jc-ink); font-size:15px; margin-bottom:2px}
.ico{color:var(--jc-accent); flex:0 0 auto}
.feats .ico{margin-top:3px}
.card .ico{margin-bottom:2px}
h2.choose{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--jc-muted); margin:0 0 10px; text-align:center}
/* signed-out hero: the mark large and centered above the wordmark (wireframe band 01) */
/* hub: the community name fits on one line beside the language button */
body:not(.mode-picker) h1{font-size:22px}
body:not(.mode-picker) .brandrow svg{width:30px; height:30px}
body.mode-picker header{flex-direction:column; align-items:center; text-align:center; position:relative; padding-top:46px}
body.mode-picker .hdr-actions{position:absolute; top:0; inset-inline-end:0}
body.mode-picker .brandrow{flex-direction:column; gap:14px}
body.mode-picker .brandrow svg{width:76px; height:76px}
body.mode-picker h1{font-size:34px}
body.mode-picker .tagline{margin:6px auto 22px; font-size:17px; color:var(--jc-ink)}
.community .who{display:flex; align-items:center; gap:12px}
.community{background:var(--jc-surface); border:1px solid var(--jc-accent); border-radius:var(--jc-radius);
  padding:18px 16px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
.community .names b{display:block; font-size:18px}
.community .names span{color:var(--jc-muted); font-size:14px}
.community .acts{display:flex; gap:8px; flex-wrap:wrap}
a.go.ghost{background:transparent; color:var(--jc-ink); border:1px solid var(--jc-line)}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="brandrow">
        <!-- the mark, full cut (on-dark colorway) — dots are homes, the center is the commons -->
        <svg width="36" height="36" viewBox="0 0 96 96" role="img" aria-label="Commons mark: eight dots encircling a center">
          <circle cx="48" cy="48" r="9" fill="#6FCF8F"></circle>
          <g fill="#3E9B76">
            <circle cx="82" cy="48" r="5.5"></circle><circle cx="72.04" cy="23.96" r="5.5"></circle>
            <circle cx="48" cy="14" r="5.5"></circle><circle cx="23.96" cy="23.96" r="5.5"></circle>
            <circle cx="14" cy="48" r="5.5"></circle><circle cx="23.96" cy="72.04" r="5.5"></circle>
            <circle cx="48" cy="82" r="5.5"></circle><circle cx="72.04" cy="72.04" r="5.5"></circle>
          </g>
        </svg>
        <h1 id="brand"></h1>
      </div>
      <p class="tagline" id="tagline"></p>
    </div>
    <div class="hdr-actions">
      <a id="authLink" href="account/"></a>
      <button id="langBtn" type="button"></button>
    </div>
  </header>
  <p class="errbar" id="errbar"></p>
  <!-- signed out: what Commons is + choose your community (sign in / join) -->
  <section id="picker" hidden>
    <ul class="feats" id="feats"></ul>
    <h2 class="choose" id="chooseTitle"></h2>
    <div id="communities"></div>
    <p class="notice" id="yours"></p>
  </section>
  <!-- signed in: the community hub (T5.0b rebuilds this with the tab bar) -->
  <section id="hub" hidden>
    <div id="bcast" role="alert"></div>
    <div class="cards" id="cards"></div>
  </section>
</main>
<footer><div id="credit"></div><div class="archive"><a id="archiveLink" target="_blank" rel="noopener"></a></div></footer>

<script src="assets/vendor/supabase-2.118.0.js"></script>

<script src="assets/icons.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/api.js"></script>

</body>
</html>
