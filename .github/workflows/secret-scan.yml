# Secret scan (harness-autonomy-plan PR 3a — the CI half of A1, 2026-11-23): fails a PR whose added lines hold a
# service-role JWT, a private key, a provider token, a password in a Postgres URI, or that adds a .env file.
# Same patterns as the local git-guard scan (tests/ci/secret-patterns.cjs is a byte copy, drift-tested in claude-config).
# A pushed key is exposed (public repo: to everyone at once; private: to everyone with access and connected build services),
# so this detects: rotate the key, don't just delete it.
# Runs on pull_request_target: GitHub uses main's copy of this file and main's scanner, so a PR can't switch the scan off.
# The PR is checked out as data only (git diff / git log); nothing from it runs. Read-only token, no secrets.
# Every commit in the PR is scanned, not only the end result: a key added and then deleted is still in the history.
# No path filter on purpose: a required check must report on every PR, or GitHub waits on it forever.
name: Secret scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]   # edited: a new base branch changes what the PR adds

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # the scanner, from the base branch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          sparse-checkout: tests/ci
          persist-credentials: false
      # the PR's history, as data only (full depth so base...head has a merge base)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Scanner tests
        run: node --test base/tests/ci/secret-scan.test.mjs
      - name: Scan the lines and files this PR adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FILES: ${{ github.event.pull_request.changed_files }}
        run: node base/tests/ci/secret-scan.mjs --repo pr --base "$BASE" --head "$HEAD" --expect-files "$FILES"
